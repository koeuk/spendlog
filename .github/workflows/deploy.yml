# SpendLog — deploy to the EC2 server over SSH. Self-contained: every deploy
# step lives here; nothing on the server is needed beyond the one-time setup
# (nginx, PHP, MySQL, the repo cloned at /var/www/spendlog — deploy/SETUP.md).
#
# Trigger: manual ("Run workflow" button on the Actions tab). Once you trust
# it, automatic deploys on every push are one edit away — see `on:` below.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     the server's public IP or DNS name (e.g. 13.212.x.x)
#   EC2_USER     the SSH user (ubuntu on Ubuntu AMIs)
#   EC2_SSH_KEY  the PRIVATE key that matches a key in the server's
#                ~/.ssh/authorized_keys (the .pem from AWS works)
name: Deploy

on:
  workflow_dispatch:
  # To deploy automatically after every push to main, replace the block above with:
  #   workflow_dispatch:
  #   push:
  #     branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check secrets are configured
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -euo pipefail
            APP_DIR=/var/www/spendlog

            # First deploy on a fresh server: clone the repo into place.
            # (Ubuntu EC2 users have passwordless sudo.)
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First deploy: cloning the repository."
              sudo mkdir -p "$APP_DIR"
              sudo chown "$USER":www-data "$APP_DIR" 2>/dev/null || sudo chown "$USER" "$APP_DIR"
              git clone https://github.com/koeuk/spendlog.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Maintenance mode only when the app is already installed.
            if [ -f vendor/autoload.php ] && [ -f .env ]; then
              php artisan down --retry=15 || true
            fi

            git pull origin main

            composer install --no-dev --optimize-autoloader --no-interaction

            npm ci
            npm run build

            # The .env cannot be invented here: it holds the DB password and
            # the super admin password. Copy deploy/env.production.example to
            # .env on the server, fill it in, and run: php artisan key:generate
            if [ ! -f .env ]; then
              echo "::error::No .env at $APP_DIR/.env — create it from deploy/env.production.example, then re-run Deploy. See deploy/SETUP.md."
              exit 1
            fi

            # --force: production refuses interactive confirmation otherwise.
            php artisan migrate --force

            # Rebuild the config/route/view caches against the new code.
            php artisan optimize

            php artisan up

            echo "Deployed $(git rev-parse --short HEAD)"
          '
