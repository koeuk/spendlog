# SpendLog — deploy to the EC2 server over SSH. Fully self-contained: on a
# fresh Ubuntu server the first run installs everything (PHP 8.4, Composer,
# Node 22, MySQL, Nginx), creates the database and .env, migrates, seeds and
# serves the app on http://EC2_HOST. Later runs detect the install and only
# update: pull → install deps → build → migrate → cache.
#
# Trigger: manual ("Run workflow" button on the Actions tab). For automatic
# deploys on every push, see the comment on `on:` below.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST              server public IP or DNS name
#   EC2_USER              SSH user (ubuntu on Ubuntu AMIs)
#   EC2_SSH_KEY           private key matching the server's authorized_keys
#   DB_PASSWORD           first run only: password for the MySQL app user
#   SUPER_ADMIN_PASSWORD  first run only: login password for koeukkos@gmail.com
# Keep the two passwords to letters and numbers (no quotes or | & \ symbols).
#
# HTTPS: once a domain points at the server, run certbot manually — see
# deploy/SETUP.md section 4 — and set APP_URL/SESSION_SECURE_COOKIE in .env.
name: Deploy

on:
  workflow_dispatch:
  # To deploy automatically after every push to main, replace the block above with:
  #   workflow_dispatch:
  #   push:
  #     branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check secrets are configured
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          SERVER_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "DB_PASSWORD='$DB_PASSWORD' SUPER_ADMIN_PASSWORD='$SUPER_ADMIN_PASSWORD' SERVER_HOST='$SERVER_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR=/var/www/spendlog

          # A missing .env is the mark of a fresh server: everything below the
          # provisioning block assumes it exists, and it is written exactly once.
          FIRST=0
          [ -f "$APP_DIR/.env" ] || FIRST=1

          if [ "$FIRST" = 1 ]; then
            : "${DB_PASSWORD:?First deploy needs the DB_PASSWORD repository secret}"
            : "${SUPER_ADMIN_PASSWORD:?First deploy needs the SUPER_ADMIN_PASSWORD repository secret}"
          fi

          # --- clone --------------------------------------------------------
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "First deploy: cloning the repository."
            sudo mkdir -p "$APP_DIR"
            sudo chown "$USER":www-data "$APP_DIR" 2>/dev/null || sudo chown "$USER" "$APP_DIR"
            git clone https://github.com/koeuk/spendlog.git "$APP_DIR"
          fi
          cd "$APP_DIR"

          # --- provision a fresh server (first run only) --------------------
          if [ "$FIRST" = 1 ]; then
            echo "First deploy: installing PHP, Composer, Node 22, MySQL, Nginx."
            export DEBIAN_FRONTEND=noninteractive

            # A previous attempt may have added the ondrej PPA on an Ubuntu
            # release it does not publish for, which breaks every apt update
            # afterwards. The filename varies by release, so purge by content:
            # remove every apt source that mentions the PPA.
            sudo add-apt-repository -r -y ppa:ondrej/php 2>/dev/null || true
            grep -rl "ondrej" /etc/apt/sources.list.d/ 2>/dev/null | while read -r f; do sudo rm -f "$f"; done
            { [ -f /etc/apt/sources.list ] && sudo sed -i "/ondrej/d" /etc/apt/sources.list; } || true

            sudo apt-get update -y
            sudo apt-get install -y software-properties-common git unzip nginx mysql-server

            PHP_EXTS="fpm cli mysql mbstring xml curl zip gd bcmath intl"
            if apt-cache show php8.4-fpm >/dev/null 2>&1; then
              # This Ubuntu packages 8.4 itself — no PPA needed.
              sudo apt-get install -y $(for e in $PHP_EXTS; do echo "php8.4-$e"; done)
            else
              # Try the distro default PHP; only reach for the ondrej PPA when
              # that default is older than the 8.4 this app requires.
              sudo apt-get install -y php-cli
              if php -r 'exit(PHP_VERSION_ID >= 80400 ? 0 : 1);'; then
                sudo apt-get install -y $(for e in $PHP_EXTS; do echo "php-$e"; done)
              else
                sudo add-apt-repository -y ppa:ondrej/php
                sudo apt-get update -y
                sudo apt-get install -y $(for e in $PHP_EXTS; do echo "php8.4-$e"; done)
              fi
            fi

            if ! command -v composer >/dev/null 2>&1; then
              curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
              sudo php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
              rm -f /tmp/composer-setup.php
            fi

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            sudo mysql -e "CREATE DATABASE IF NOT EXISTS spendlog CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'spendlog'@'localhost' IDENTIFIED BY '${DB_PASSWORD}'; ALTER USER 'spendlog'@'localhost' IDENTIFIED BY '${DB_PASSWORD}'; GRANT ALL PRIVILEGES ON spendlog.* TO 'spendlog'@'localhost'; FLUSH PRIVILEGES;"

            # Nginx vhost from the repo template; serves on the bare IP until
            # a domain + certbot arrive (SETUP.md section 4).
            sudo cp deploy/nginx.conf /etc/nginx/sites-available/spendlog
            sudo sed -i 's/YOUR_DOMAIN/_/' /etc/nginx/sites-available/spendlog
            # The template names php8.4-fpm.sock; point it at whichever PHP
            # version actually got installed above.
            PHP_SOCK="php$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')-fpm.sock"
            sudo sed -i "s/php8\.4-fpm\.sock/${PHP_SOCK}/" /etc/nginx/sites-available/spendlog
            sudo ln -sf /etc/nginx/sites-available/spendlog /etc/nginx/sites-enabled/spendlog
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx
          fi

          # --- update -------------------------------------------------------
          if [ "$FIRST" = 0 ] && [ -f vendor/autoload.php ]; then
            php artisan down --retry=15 || true
          fi

          # reset --hard rather than pull: survives any local drift on the
          # server (edited files, force-pushed history).
          git fetch origin main
          git reset --hard origin/main

          composer install --no-dev --optimize-autoloader --no-interaction

          npm ci
          npm run build

          # --- first-run app configuration ----------------------------------
          if [ ! -f .env ]; then
            cp deploy/env.production.example .env
            sed -i "s|^APP_URL=.*|APP_URL=http://${SERVER_HOST}|" .env
            sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" .env
            sed -i "s|^SUPER_ADMIN_PASSWORD=.*|SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}|" .env
            # No HTTPS yet: a secure-only cookie would break login over http.
            sed -i "s|^SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=false|" .env
            php artisan key:generate --force
          fi

          # --force: production refuses interactive confirmation otherwise.
          php artisan migrate --force

          if [ "$FIRST" = 1 ]; then
            php artisan db:seed --force
            php artisan storage:link || true
          fi

          # Laravel only writes here; group-write for the php-fpm user.
          sudo chgrp -R www-data storage bootstrap/cache
          sudo chmod -R g+w storage bootstrap/cache

          # Rebuild the config/route/view caches against the new code.
          php artisan optimize

          # New PHP code is only picked up by fpm workers after a reload.
          PHP_V=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          sudo systemctl reload "php${PHP_V}-fpm" || sudo systemctl restart "php${PHP_V}-fpm" || true

          php artisan up

          echo "Deployed $(git rev-parse --short HEAD)"
          REMOTE
