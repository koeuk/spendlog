name: Savings
description: |-

  A month at a time, like budgets: a **plan** says how much to put aside this
  month, and the **entries** are the money that actually moved. What is saved
  is always the sum of the entries — nothing is stored that could drift from
  it — and a withdrawal can never take out more than the all-time balance, so
  that balance is never negative.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/savings/summary
    metadata:
      custom: []
      groupName: Savings
      groupDescription: |-

        A month at a time, like budgets: a **plan** says how much to put aside this
        month, and the **entries** are the money that actually moved. What is saved
        is always the sum of the entries — nothing is stored that could drift from
        it — and a withdrawal can never take out more than the all-time balance, so
        that balance is never negative.
      subgroup: ''
      subgroupDescription: ''
      title: 'Savings summary'
      description: |-
        What went aside this month against what was planned, plus the all-time
        balance — the headline figure, since savings carry over between months.

        `percent` is capped at 100 so a bar cannot overflow its track;
        `percent_raw` keeps the truth. `status` is `ok` | `close` (>=80) |
        `met` (>=100).
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      month:
        custom: []
        name: month
        description: 'YYYY-MM. Anything malformed falls back to the current month rather than erroring.'
        required: false
        example: 2026-09
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      month: 2026-09
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data": {"month": "2026-09", "planned": "100.00", "saved_this_month": "60.00", "remaining": "40.00", "percent": 60, "percent_raw": 60, "status": "ok", "total_saved": "1240.00", "entries_count": 2}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
